[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spxa"
version = "1.0.1"
description = "Stochastic processes as first-class algebraic objects"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nityahapani", email = "nityahapani.tges@gmail.com" }]
requires-python = ">=3.10"
keywords = ["stochastic processes", "levy processes", "probability", "mathematics", "finance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit",
    "matplotlib>=3.7",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]
diff = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[project.urls]
Homepage = "https://github.com/Nityahapani/spxa"
Documentation = "https://nityahapani.github.io/spxa"
Repository = "https://github.com/Nityahapani/spxa"
Issues = "https://github.com/Nityahapani/spxa/issues"
Changelog = "https://github.com/Nityahapani/spxa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["spxa*"]
exclude = ["audits*", "tests*", "benchmarks*", "scripts*", "docs*", "site*", "examples_output*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B023", "B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = [
    "override",
    "misc",
    "arg-type",
    "return-value",
    "call-arg",
    "index",
    "valid-type",
    "attr-defined",
    "type-var",
    "assignment",
    "operator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "exactness: marks tests that verify closed-form results against published formulas (never skip)",
    "slow: marks tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["spxa"]
omit = ["spxa/_internals/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
