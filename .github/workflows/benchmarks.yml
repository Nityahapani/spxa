name: Benchmarks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmarks-${{ runner.os }}-py311-${{ github.sha }}
          restore-keys: benchmarks-${{ runner.os }}-py311-
      - name: Benchmark and compare with previous successful cached run
        shell: bash
        run: |
          if find .benchmarks -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            pytest benchmarks/ --benchmark-only --benchmark-autosave --benchmark-compare \
              --benchmark-compare-fail=mean:20% --benchmark-min-rounds=5
          else
            pytest benchmarks/ --benchmark-only --benchmark-autosave --benchmark-min-rounds=5
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/
