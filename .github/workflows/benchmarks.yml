name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" pytest-benchmark
      - name: Run benchmarks
        run: |
          pytest benchmarks/ \
            --benchmark-json=benchmarks/results/$(git rev-parse --short HEAD).json \
            --benchmark-min-rounds=5 \
            --benchmark-disable-gc
      - name: Commit results
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/
          git diff --cached --quiet || git commit -m "chore: benchmark results $(git rev-parse --short HEAD)"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  regression-check:
    name: Regression check
    runs-on: ubuntu-latest
    needs: run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pytest-benchmark
      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
      - name: Check for regressions
        run: python scripts/check_benchmark_regression.py --threshold 0.20
